[package]
name = "valfisk"
version = "0.1.0"
edition = "2024"

description = "Next-generation general purpose Discord app"
authors = ["Ryan Cao <hello@ryanccn.dev>"]
license = "AGPL-3.0-only"
publish = false

[dependencies]
aws-lc-rs = "1.19.0"
base64 = "0.23.1"
bytesize = "2.7.0"
color-eyre = "0.6.5"
dotenvy = "0.15.7"
envy = "0.4.2"
eyre = "0.6.14"
futures-util = "0.3.34"
hex = "0.4.3"
hickory-resolver = { version = "0.26.3", features = ["https-aws-lc-rs", "dnssec-aws-lc-rs", "rustls-platform-verifier"] }
indexmap = { version = "2.14.2", features = ["serde"] }
jiff = { version = "0.2.46", features = ["serde"] }
percent-encoding = "2.3.2"
poise = { git = "https://github.com/serenity-rs/poise.git", branch = "serenity-next" }
rand = "0.10.4"
redis = { version = "1.8.2", features = ["tokio-rustls-comp", "tls-rustls", "connection-manager"] }
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["query", "json", "deflate", "gzip", "brotli", "zstd"] }
rustls = "0.23.46"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = { version = "0.40.3", default-features = false, features = ["system"] }
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.2.1"
tracing = { version = "0.1.44", features = ["release_max_level_info"] }
tracing-error = "0.2.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

unreadable_literal = "allow"
module_name_repetitions = "allow"
redundant_closure_for_method_calls = "allow"
doc_markdown = "allow"

[lints.rust]
unsafe_code = "forbid"
